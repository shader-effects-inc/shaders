name: Release

# A release is a merged pull request that bumps the version in packages/shaders/package.json
# (prepared locally with `pnpm release`, which also writes the CHANGELOG.md section).
#
# On every push to main: if the version has no tag yet, this is that merge. Verify the
# changelog has an entry for it, build, publish to npm (trusted publisher, OIDC), tag the
# merge commit and create the GitHub Release from the same changelog section. An ordinary
# merge (version already tagged) exits at the first step.
#
# Manual dispatch is always a dry run: build + `npm publish --dry-run`, nothing published.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Detect release
        id: detect
        run: |
          VERSION=$(node -p "require('./packages/shaders/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already tagged: not a release merge."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION has no tag: this merge is the release."
          fi

      - name: Verify changelog entry
        if: steps.detect.outputs.release == 'true'
        run: |
          VERSION="${{ steps.detect.outputs.version }}"
          if ! grep -Eq "^## v${VERSION//./\\.}( |$)" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No '## v$VERSION' entry in CHANGELOG.md. Prepare releases with 'pnpm release'."
            exit 1
          fi
          # The release notes: this version's section, up to the next version heading
          awk -v v="## v$VERSION" '
            $0 == v || index($0, v " ") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          echo "Release notes:"; cat release-notes.md

      - name: Setup Node.js
        if: steps.detect.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        if: steps.detect.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        if: steps.detect.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        if: steps.detect.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        if: steps.detect.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
        run: pnpm install --frozen-lockfile

      - name: Update npm for OIDC support
        if: steps.detect.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          npm install -g npm@^11
          echo "npm version: $(npm --version)"

      - name: Build all packages
        if: steps.detect.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
        run: pnpm lib:build --force

      - name: Publish to npm (dry run)
        if: github.event_name == 'workflow_dispatch'
        working-directory: packages/shaders
        run: npm publish --access public --dry-run

      # Skips when this version is already on npm, so a run that failed AFTER publishing
      # (tag or GitHub Release step) can simply be re-run without a 409 from the registry.
      - name: Publish to npm
        if: steps.detect.outputs.release == 'true' && github.event_name == 'push'
        working-directory: packages/shaders
        run: |
          VERSION="${{ steps.detect.outputs.version }}"
          if npm view "shaders@$VERSION" version > /dev/null 2>&1; then
            echo "shaders@$VERSION is already on npm; skipping publish and continuing with the tag and release."
          else
            npm publish --access public
          fi

      - name: Tag the release
        if: steps.detect.outputs.release == 'true' && github.event_name == 'push'
        run: |
          VERSION="${{ steps.detect.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        if: steps.detect.outputs.release == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.detect.outputs.version }}" --title "v${{ steps.detect.outputs.version }}" --notes-file release-notes.md

      - name: Summary
        run: |
          VERSION="${{ steps.detect.outputs.version }}"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "### Dry run of v$VERSION" >> $GITHUB_STEP_SUMMARY
            echo "Built and ran \`npm publish --dry-run\`. Nothing was published." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.detect.outputs.release }}" == "true" ]; then
            echo "### Released v$VERSION :rocket:" >> $GITHUB_STEP_SUMMARY
            echo "Published to npm, tagged \`v$VERSION\`, GitHub Release created." >> $GITHUB_STEP_SUMMARY
          else
            echo "### No release" >> $GITHUB_STEP_SUMMARY
            echo "v$VERSION is already tagged; this push to main was an ordinary merge." >> $GITHUB_STEP_SUMMARY
          fi
